# Build the static export and publish ./out to GitHub Pages on every push to
# main. For a root-domain site this repo must be named msail/msail.github.io
# (or MSAIL/MSAIL.github.io) and Pages must be set to "GitHub Actions" under
# Settings → Pages → Build and deployment.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# GitHub forces JS actions onto Node 24 from 2026-06-16; opt in early so any
# breakage shows up on our schedule, not theirs.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # IndexNow tells Bing (whose index Copilot and other assistants search),
      # Yandex, Naver, Seznam and Yep which URLs just changed, so they recrawl
      # now instead of whenever they next pass by. public/da749e524e7e9d9308e81e2b7694ae6c.txt proves
      # we own the host. A failed ping never fails the deploy.
      - name: Notify IndexNow
        continue-on-error: true
        env:
          KEY: da749e524e7e9d9308e81e2b7694ae6c
          SITE: https://msail.github.io
        run: |
          urls=$( { curl -fsS "$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//'; printf '%s\n' "$SITE/llms.txt" "$SITE/llms-full.txt" "$SITE/msail.json"; } | jq -R . | jq -s . )
          jq -n --arg key "$KEY" --arg site "$SITE" --argjson urls "$urls" \
            '{host: ($site | sub("^https://"; "")), key: $key, keyLocation: ($site + "/" + $key + ".txt"), urlList: $urls}' \
            | curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data-binary @- -o /dev/null -w 'IndexNow answered %{http_code}\n'
